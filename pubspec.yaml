name: flashship_driver
description: Flash Driver App - Nhận và hoàn thành đơn giao hàng
publish_to: 'none'
version: 10.0.3+103

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.5
  firebase_database: ^11.3.5

  # Network
  dio: ^5.7.0

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.6.2

  # Storage
  shared_preferences: ^2.3.3

  # Location
  geolocator: ^13.0.2

  # UI
  google_fonts: ^6.2.1

  # Navigation
  url_launcher: ^6.3.1

  # Audio
  audioplayers: ^6.1.0

  # QR code
  qr_flutter: ^4.1.0

  # Utils
  intl: ^0.19.0
  permission_handler: ^11.3.1
  image_picker: ^1.1.2
  flutter_local_notifications: ^18.0.1
  package_info_plus: ^10.1.0
  flutter_html: ^3.0.0

dependency_overrides:
  # path_provider_foundation 2.6.0 pulls in objective_c 9.3.0 which crashes
  # on iOS 26 beta simulator. Pin to 2.3.2 (last version without that dep).
  path_provider_foundation: 2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/sounds/
